# The whole platform: Postgres, Kafka (KRaft), 1 http, 2 customer and 1 audit verticle.
# Start it with: podman compose -f compose.full.yaml up -d --build   (or docker compose ...)
# The credentials below are for local use only.
x-verticle: &verticle
  build: .
  restart: unless-stopped

x-customer-env: &customer-env
  PG_HOST: postgres
  PG_DATABASE: customers
  PG_USER: customers
  PG_PASSWORD: customers

services:
  postgres:
    image: docker.io/postgres:17
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: customers
      POSTGRES_PASSWORD: customers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers -d customers"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: docker.io/apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Unlike compose.yaml, the clients are other containers, so the broker advertises its service name
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Two instances: the event bus spreads the requests between them
  customer-1:
    <<: *verticle
    command: ["me.bataillec.portfolio.customer.CustomerVerticle"]
    environment: *customer-env
    depends_on:
      postgres:
        condition: service_healthy

  customer-2:
    <<: *verticle
    command: ["me.bataillec.portfolio.customer.CustomerVerticle"]
    environment: *customer-env
    depends_on:
      postgres:
        condition: service_healthy

  audit:
    <<: *verticle
    command: ["me.bataillec.portfolio.customer.AuditVerticle"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  http:
    <<: *verticle
    command: ["me.bataillec.portfolio.customer.HttpServerVerticle"]
    ports:
      # Configurable because 8080 is often taken on a developer machine
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - customer-1
      - customer-2
      - audit

# Hazelcast (5701) is deliberately not published: the cluster has no authentication
volumes:
  pgdata:
  kafkadata:
