name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.0
      - name: Unit tests and 85% coverage gate
        run: mvn -B verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            target/surefire-reports
            target/cobertura.xml
            target/site/scoverage
          if-no-files-found: ignore

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.0
      # Docker is preinstalled; Ryuk stays enabled for the cleanup.
      - name: Integration tests (Postgres, Kafka, Hazelcast cluster)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  package:
    name: Fat JAR
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.0
      - run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: customer-api-jar
          path: target/customer-api-vertx-*.jar
          if-no-files-found: error

  docker:
    name: Docker image
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export the image
        run: docker save ${{ env.IMAGE }}:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 3

  e2e:
    name: End-to-end scenarios
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.0
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - run: docker load < image.tar.gz
      # failsafe goals are called directly: -DskipITs would skip them too.
      - name: Cucumber scenarios against the image under test
        run: >
          mvn -B -Pe2e test-compile failsafe:integration-test failsafe:verify
          -De2e.image=${{ env.IMAGE }}:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            target/cucumber-reports
            target/failsafe-reports
          if-no-files-found: ignore

  publish:
    name: Publish image and release
    needs: [integration, e2e, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - run: docker load < image.tar.gz
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "$IMAGE:ci" "$tag"
            docker push "$tag"
          done
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: customer-api-jar
          path: jar
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: jar/*.jar
          generate_release_notes: true
